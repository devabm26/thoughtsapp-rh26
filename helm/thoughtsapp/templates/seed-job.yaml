{{- if .Values.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-seed
  labels:
    {{- include "thoughtsapp.labels" . | nindent 4 }}
    app: postgresql-seed
spec:
  ttlSecondsAfterFinished: {{ .Values.seed.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: postgresql-seed
    spec:
      restartPolicy: Never
      containers:
      - name: seed
        image: {{ .Values.postgresql.image }}
        command:
        - /bin/bash
        - -c
        - |
          # Wait for PostgreSQL to be ready
          until pg_isready -h postgresql -U ${POSTGRES_USER} -d ${POSTGRES_DB}; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL is ready. Waiting for backend service to create schema..."

          # Wait for the thoughts table to exist (created by backend via Hibernate)
          MAX_WAIT=300  # 5 minutes
          WAITED=0
          until psql -h postgresql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c "\d thoughts" >/dev/null 2>&1; do
            if [ $WAITED -ge $MAX_WAIT ]; then
              echo "ERROR: Timeout waiting for 'thoughts' table to be created by backend service."
              echo "Make sure the thoughts-backend service is running and has created the database schema."
              exit 1
            fi
            echo "Waiting for backend service to create schema (${WAITED}s/${MAX_WAIT}s)..."
            sleep 5
            WAITED=$((WAITED + 5))
          done

          echo "Schema detected. Checking if data already exists..."

          # Check if data already exists
          COUNT=$(psql -h postgresql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -t -c "SELECT COUNT(*) FROM thoughts;" 2>/dev/null || echo "0")

          if [ "$COUNT" -gt "0" ]; then
            echo "Database already seeded with $COUNT thoughts. Skipping."
            exit 0
          fi

          echo "Seeding database..."
          psql -h postgresql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /seed/import.sql
          echo "Database seeded successfully!"
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: database-name
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: database-user
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: database-password
        volumeMounts:
        - name: seed-data
          mountPath: /seed
      volumes:
      - name: seed-data
        configMap:
          name: postgresql-seed-data
{{- end }}
