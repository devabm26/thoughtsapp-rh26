{{- if .Values.backend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.name }}
  labels:
    {{- include "thoughtsapp.labels" . | nindent 4 }}
    app: {{ .Values.backend.name }}
spec:
  ports:
  - name: http
    port: {{ .Values.backend.port }}
    targetPort: {{ .Values.backend.port }}
  selector:
    app: {{ .Values.backend.name }}
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name }}
  labels:
    {{- include "thoughtsapp.labels" . | nindent 4 }}
    app: {{ .Values.backend.name }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.backend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.backend.name }}
    spec:
      initContainers:
      - name: wait-for-dependencies
        image: {{ .Values.postgresql.image }}
        command:
        - /bin/bash
        - -c
        - |
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h postgresql -U ${POSTGRES_USER} -d ${POSTGRES_DB}; do
            echo "PostgreSQL not ready, waiting..."
            sleep 2
          done
          echo "✓ PostgreSQL is ready"

          echo "Waiting for Kafka to be ready..."
          KAFKA_BOOTSTRAP="{{ include "thoughtsapp.kafka.bootstrap" . }}"
          KAFKA_HOST="${KAFKA_BOOTSTRAP%%:*}"  # Extract host (before colon)
          KAFKA_PORT="${KAFKA_BOOTSTRAP##*:}"  # Extract port (after colon)
          MAX_WAIT=300  # 5 minutes
          WAITED=0

          until timeout 5 bash -c "cat < /dev/null > /dev/tcp/${KAFKA_HOST}/${KAFKA_PORT}" 2>/dev/null; do
            if [ $WAITED -ge $MAX_WAIT ]; then
              echo "ERROR: Timeout waiting for Kafka at ${KAFKA_HOST}:${KAFKA_PORT}"
              echo "Make sure the Kafka cluster is running."
              exit 1
            fi
            echo "Kafka not ready at ${KAFKA_HOST}:${KAFKA_PORT}, waiting... (${WAITED}s/${MAX_WAIT}s)"
            sleep 5
            WAITED=$((WAITED + 5))
          done
          echo "✓ Kafka is ready at ${KAFKA_HOST}:${KAFKA_PORT}"

          echo "All dependencies ready. Starting backend service..."
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: database-name
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: database-user
      containers:
      - name: {{ .Values.backend.name }}
        image: {{ .Values.backend.image }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.backend.port }}
          protocol: TCP
        env:
        - name: QUARKUS_DATASOURCE_JDBC_URL
          value: {{ include "thoughtsapp.postgresql.url" . }}
        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: database-user
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: database-password
        - name: QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION
          value: {{ .Values.backend.hibernate.generation }}
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ include "thoughtsapp.kafka.bootstrap" . }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
{{- if .Values.backend.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.backend.name }}
  labels:
    {{- include "thoughtsapp.labels" . | nindent 4 }}
    app: {{ .Values.backend.name }}
spec:
  {{- if or .Values.backend.route.host .Values.global.clusterDomain }}
  host: {{ .Values.backend.route.host | default (printf "%s-%s.%s" .Values.backend.name .Release.Namespace .Values.global.clusterDomain) }}
  {{- end }}
  to:
    kind: Service
    name: {{ .Values.backend.name }}
  port:
    targetPort: http
  {{- if .Values.backend.route.tls }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  {{- end }}
{{- end }}
{{- end }}
