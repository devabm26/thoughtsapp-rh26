---
# Red Hat AMQ Streams 2.7.0-7
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: thoughtsapp-kafka
  labels:
    app.kubernetes.io/part-of: thoughtsapp
  annotations:
    amq-streams-version: 2.7.0-7
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      inter.broker.protocol.version: "3.7"
    storage:
      type: ephemeral
  zookeeper:
    replicas: 3
    storage:
      type: ephemeral
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: thoughts-events
  labels:
    strimzi.io/cluster: thoughtsapp-kafka
    app.kubernetes.io/part-of: thoughtsapp
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000
    segment.bytes: 1073741824
