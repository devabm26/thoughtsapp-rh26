---
apiVersion: v1
kind: Secret
metadata:
  name: evaluation-secret
  labels:
    app: thoughts-evaluation
    app.kubernetes.io/part-of: thoughtsapp
type: Opaque
stringData:
  # LLM endpoint URL (OpenAI-compatible API)
  # Examples:
  #   - Ollama: http://ollama-service:11434/v1
  #   - OpenShift AI: https://your-rhoai-endpoint/v1
  #   - OpenAI: https://api.openai.com/v1
  OPENSHIFT_AI_ENDPOINT_URL: "https://litellm-prod.apps.maas.redhatworkshops.io/v1"

  # API key for the LLM endpoint
  # For Ollama, use "dummy-key" or any placeholder
  # For OpenAI/RHOAI, use your actual API key
  OPENSHIFT_AI_API_KEY: "xxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

  # OpenAI base URL (alternative to OPENSHIFT_AI_ENDPOINT_URL)
  # Used by some clients for OpenAI-compatible endpoints
  OPENAI_BASE_URL: "https://litellm-prod.apps.maas.redhatworkshops.io/v1"

  # Embedding model name
  # Examples:
  #   - Ollama: nomic-embed-text, all-minilm
  #   - OpenAI: text-embedding-ada-002, text-embedding-3-small
  #   - OpenShift AI: depends on deployed model
  EMBEDDING_MODEL_NAME: "nomic-embed-text-v1-5"
