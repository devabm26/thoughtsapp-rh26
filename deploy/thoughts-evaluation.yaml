---
apiVersion: v1
kind: Service
metadata:
  name: thoughts-evaluation
  labels:
    app: thoughts-evaluation
    app.kubernetes.io/part-of: thoughtsapp
spec:
  ports:
  - name: http
    port: 8088
    targetPort: 8088
  selector:
    app: thoughts-evaluation
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thoughts-evaluation
  labels:
    app: thoughts-evaluation
    app.kubernetes.io/part-of: thoughtsapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thoughts-evaluation
  template:
    metadata:
      labels:
        app: thoughts-evaluation
    spec:
      containers:
      - name: thoughts-evaluation
        image: quay.io/redhat_na_ssa/thoughtsapp-evaluation:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8088
          protocol: TCP
        env:
        - name: QUARKUS_DATASOURCE_JDBC_URL
          value: jdbc:postgresql://postgresql:5432/thoughts
        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: database-user
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: database-password
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: thoughtsapp-kafka-kafka-bootstrap:9092
        - name: OPENSHIFT_AI_ENDPOINT_URL
          valueFrom:
            secretKeyRef:
              name: evaluation-secret
              key: OPENSHIFT_AI_ENDPOINT_URL
        - name: OPENSHIFT_AI_API_KEY
          valueFrom:
            secretKeyRef:
              name: evaluation-secret
              key: OPENSHIFT_AI_API_KEY
        - name: OPENAI_BASE_URL
          valueFrom:
            secretKeyRef:
              name: evaluation-secret
              key: OPENAI_BASE_URL
        - name: EMBEDDING_MODEL_NAME
          valueFrom:
            secretKeyRef:
              name: evaluation-secret
              key: EMBEDDING_MODEL_NAME
        - name: EVALUATION_SIMILARITY_THRESHOLD
          value: "0.85"
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8088
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8088
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: thoughts-evaluation
  labels:
    app: thoughts-evaluation
    app.kubernetes.io/part-of: thoughtsapp
spec:
  to:
    kind: Service
    name: thoughts-evaluation
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
